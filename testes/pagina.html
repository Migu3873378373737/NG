<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NG Web Server</title>
    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;

        .card {

        h1 { color: #38bdf8; }

<body>
    <div class="card">
        <h1>NG Web Server 🚀</h1>
        <p>Nosso servidor está entregando HTML!</p>

        </button>
    </div>

</html>
